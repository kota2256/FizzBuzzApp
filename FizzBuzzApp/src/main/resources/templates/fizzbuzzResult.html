<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<!-- CSS読み込み -->
	<link rel="stylesheet" th:href="@{/css/fizzbuzzResult.css}">
	
	<title>FizzBuzzResult</title>
</head>

<body>
	<div class="text-center fizzbuzzResult">
		<h1 class="h1 mt-5">FizzBuzzResult</h1>
		
		<!--戻るボタン-->
		<button type="button" onclick="location.href='/home'" th:text="戻る" class="btn btn-outline-danger mt-5"></button>
		
		<!--FizzBuzz結果表示-->
		<div>
			<table class="table table-striped table-borderd table-hover  mt-5">
				<tr>
					<th>元の数値</th>
					<th>判定結果</th>
				</tr>
				<tr th:each="item : ${fizzbuzzResultList}">
					<td th:text="${item.serialNum}"></td>
					<td th:text="${item.fizzbuzzResult}"></td>
				</tr>
			</table>
		</div>
		
		<!--戻るボタン-->
		<button type="button" onclick="location.href='/home'" th:text="戻る" class="btn btn-outline-danger mt-5"></button>
		
		<!--履歴表示-->
		<div>
			<table class="table table-striped table-borderd table-hover  mt-5 mb-5">
				<tr>
					<th>過去の入力値</th>
				</tr>
				<tr th:each="item : ${inputNumList}">
					<td th:text="${item.inputNum}"></td>
				</tr>
			</table>
		</div>
	</div>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
