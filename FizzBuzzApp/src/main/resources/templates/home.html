<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<!-- CSS読み込み -->
	<link rel="stylesheet" th:href="@{/css/FizzBuzzHome.css}">
	
	<title>FizzBuzzHome</title>
</head>

<body>
	<div class="text-center fizzbuzzhome">
		<form method="post" th:action="@{/home}">
			<h1 class="h1 mt-5">FizzBuzzApp</h1>
			<br />
			<!--数値入力欄-->
			<div>
				<label for="num">数値入力欄：</label>
				<input type="number" id="num" name="num" class="form-control">
			</div>
			<input type="submit" th:value="判定" class="btn btn-primary mt-3"></input>
		</form>
	</div>
	
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
